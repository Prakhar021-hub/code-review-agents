[project]
name = "code-review-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prakhar Rajak", email = "prakharrajak418@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langsmith>=0.14.17",
    "mcp[cli]<2",
    "openai>=3.41.0",
    "python-dotenv>=1.2.4",
]



[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
review = "code_review_agents.cli:main"


[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:langsmith",
]

license = "MIT"